name: Website preview checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'auditions.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/preview-check.yml'
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/site-smoke.mjs
      - run: |
          python3 -m http.server 8000 >/tmp/bappaz-preview.log 2>&1 &
          node tests/visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-preview-screenshots
          path: preview-shots/
